[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openroboto-jev-controller"
version = "0.1.0"
description = "Experimental Jev discrete controller for OpenRoboto's LIBERO policy protocol"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "msgpack==1.1.1", "websockets==15.0.1"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
sim = ["mujoco==3.2.3", "robosuite==1.4.1", "numba==0.59.1", "torch==2.2.2", "imageio[ffmpeg]==2.35.1", "opencv-python==4.10.0.84", "bddl==1.0.1", "easydict==1.13", "pyyaml==6.0.2", "matplotlib==3.8.4", "gym==0.25.2", "cloudpickle==2.2.1", "future==0.18.3", "huggingface-hub>=0.30,<1"]

[project.scripts]
jev-policy = "jev_robot.server:main"
jev-libero = "jev_robot.run_libero:main"

[tool.setuptools.packages.find]
include = ["jev_robot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
